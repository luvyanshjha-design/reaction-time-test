<!DOCTYPE html>
<html>
<head>
  <title>Reaction Test</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: red;
      color: white;
      text-align: center;
    }

    button {
      font-size: 25px;
      padding: 15px 30px;
      cursor: pointer;
    }
    #message {
      font-size: 50px;
    }

    #result {
      font-size: 22px;
    }
  </style>
</head>

<body>

<div>
  <h1 id="message">REACTION TEST</h1>
  <p id="result"></p>
  <button id="start">START</button>
  <button id="again" style="display: none;">TRY AGAIN</button>
</div>

<script>
  let startTime;
  let waiting = false;
  let playing = false;
  let bestTime = null;
  let totalTime = 0;
  let attempts = 0;
  let timer;

  const startButton = document.getElementById("start");
  const againButton = document.getElementById("again");
  const message = document.getElementById("message");
  const result = document.getElementById("result");

  function startGame(event) {
    event.stopPropagation();

    startButton.style.display = "none";
    againButton.style.display = "none";
    message.textContent = "WAIT...";
    document.body.style.background = "red";

    waiting = true;
    playing = true;

    let randomTime = Math.random() * 3000 + 1000;

    timer = setTimeout(function() {
      document.body.style.background = "green";
      message.textContent = "CLICK!";
      startTime = Date.now();
      waiting = false;
    }, randomTime);
  }

  startButton.onclick = startGame;
  againButton.onclick = startGame;

  document.body.onclick = function() {
    if (!playing) return;

    if (waiting) {
      message.textContent = "TOO EARLY!";
      if (waiting) {
        message.textContent = "TOO EARLY!";
        clearTimeout(timer);
        reset();
        return;
      }
      reset();
      return;
    }

    let reactionTime = Date.now() - startTime;
    totalTime += reactionTime;
    attempts++;

    if (bestTime === null || reactionTime < bestTime) {
      bestTime = reactionTime;
    }

    let averageTime = Math.round(totalTime / attempts);
    message.textContent = reactionTime + " ms";
    result.textContent = "Best: " + bestTime + " ms | Avg: " + averageTime + " ms";
    reset();
  };

  function reset() {
    playing = false;
    waiting = false;

    startButton.style.display = "none";
    againButton.style.display = "inline-block";
    document.body.style.background = "red";
  }
</script>

</body>
</html>
